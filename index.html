<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark light"/>
<title>VELVA — Claude Chat Studio</title>
<meta name="description" content="VELVA — a precision Claude chat studio. All 16 Claude models, free via Puter.js. Streaming, reasoning, vision, web search, image generation, and more."/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="src/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="app" class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar" class="sidebar" aria-label="Conversations">
    <div class="sb-head">
      <button id="btn-new" class="sb-brand" title="New chat (Ctrl+N)">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 6 L20 18 L12 22 L4 18 L4 6 Z" fill="currentColor"/><path d="M12 6 L16 8 L16 12 L12 14 L8 12 L8 8 Z" fill="rgba(0,0,0,0.35)"/></svg>
        </span>
        <span class="brand-word">VELVA</span>
        <span class="brand-new-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
      </button>
      <div class="sb-search">
        <svg class="sb-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="chat-search" type="search" placeholder="Search conversations…" aria-label="Search conversations" autocomplete="off"/>
        <kbd class="sb-search-kbd">/</kbd>
      </div>
    </div>

    <nav id="session-list" class="sb-list" aria-label="Session list"></nav>

    <div class="sb-foot">
      <button id="btn-theme" class="sb-foot-btn" title="Toggle theme (Ctrl+Shift+T)">
        <svg id="ico-theme-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg id="ico-theme-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
      <button id="btn-import" class="sb-foot-btn" title="Import conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button id="btn-export-all" class="sb-foot-btn" title="Export all conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button id="btn-settings" class="sb-foot-btn" title="Settings & models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <input id="import-file" type="file" accept=".json,application/json" hidden/>
      <div class="sb-stats" id="sb-stats" title="Session usage"></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main id="main" class="main">
    <header id="topbar" class="topbar">
      <button id="btn-menu" class="tb-btn tb-menu" title="Conversations (Ctrl+B)" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="tb-center">
        <button id="chat-title" class="chat-title" title="Rename conversation">New chat</button>
        <button id="model-btn" class="model-btn" title="Choose model">
          <span class="model-dot" aria-hidden="true"></span>
          <span id="model-btn-label">Claude Sonnet 5</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>

      <div class="tb-actions">
        <button id="btn-search" class="tb-btn" title="Search the web with this model (Perplexity mode)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg>
        </button>
        <button id="btn-draw" class="tb-btn" title="Generate an image with AI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        </button>
        <button id="btn-panel" class="tb-btn" title="Models & settings (Ctrl+\))">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button id="btn-export-chat" class="tb-btn" title="Export this chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <button id="btn-clear" class="tb-btn" title="Clear this chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
        <button id="btn-delete" class="tb-btn tb-danger" title="Delete this chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </header>

    <div id="scroller" class="scroller">
      <div id="messages" class="messages" aria-live="polite"></div>
      <button id="scroll-down" class="scroll-down" hidden aria-label="Scroll to latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <footer id="composer" class="composer">
      <div id="attach-row" class="attach-row" hidden></div>
      <div class="composer-box">
        <button id="mic-btn" class="cx-btn" title="Speak your message (Ctrl+M)" aria-label="Speech input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
        </button>
        <textarea id="textarea" rows="1" placeholder="Message Claude…  (Enter to send, Shift+Enter for newline)" aria-label="Message"></textarea>
        <button id="attach-btn" class="cx-btn" title="Attach an image (vision)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9"/><path d="m3 16 5-5 4 4 3-3 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M16 19h6m-3-3v6"/></svg>
        </button>
        <button id="draw-btn" class="cx-btn" title="Generate image (draw)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        </button>
        <button id="send-btn" class="send-btn" title="Send (Enter)" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 22 12 3.4 3.6 3 10l12 2-12 2Z"/></svg>
          <svg class="send-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-hints">
        <span class="ch-hint" id="ch-model"></span>
        <span class="ch-hint"><kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> newline</span>
        <span class="ch-hint ch-tokens" id="ch-tokens"></span>
      </div>
    </footer>
  </main>

  <!-- ============ RIGHT PANEL ============ -->
  <aside id="panel" class="panel" aria-label="Models and settings">
    <div class="pn-head">
      <span class="pn-title">Studio</span>
      <button id="btn-panel-close" class="pn-close" aria-label="Close panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pn-scroll">
      <section class="pn-section">
        <h3 class="pn-label">Model</h3>
        <div id="model-group" class="model-group"></div>
        <select id="model-select" class="pn-select" aria-label="All Claude models"></select>
      </section>

      <section class="pn-section">
        <h3 class="pn-label">Tuning</h3>
        <label class="pn-row">
          <span class="pn-row-text"><span class="pn-name">Temperature</span><span class="pn-desc">Creativity & randomness</span></span>
          <input id="temp" type="range" min="0" max="2" step="0.1" value="0.7"/>
          <span id="temp-val" class="pn-val">0.7</span>
        </label>
        <label class="pn-row">
          <span class="pn-row-text"><span class="pn-name">Max tokens</span><span class="pn-desc">Response length cap</span></span>
          <input id="maxtok" type="range" min="256" max="64000" step="256" value="4096"/>
          <span id="maxtok-val" class="pn-val">4k</span>
        </label>
      </section>

      <section class="pn-section">
        <h3 class="pn-label">System prompt</h3>
        <textarea id="system" class="pn-textarea" rows="4" placeholder="Optional instructions for this chat…"></textarea>
      </section>

      <section class="pn-section">
        <h3 class="pn-label">Toggles</h3>
        <div class="pn-toggles">
          <label class="pn-toggle"><span class="pn-name">Search the web</span><input id="t-search" type="checkbox"/><span class="switch" aria-hidden="true"></span></label>
          <label class="pn-toggle"><span class="pn-name">Show reasoning</span><input id="t-reason" type="checkbox" checked/><span class="switch" aria-hidden="true"></span></label>
          <label class="pn-toggle"><span class="pn-name">Markdown rendering</span><input id="t-markdown" type="checkbox" checked/><span class="switch" aria-hidden="true"></span></label>
          <label class="pn-toggle"><span class="pn-name">Streaming</span><input id="t-stream" type="checkbox" checked/><span class="switch" aria-hidden="true"></span></label>
          <label class="pn-toggle"><span class="pn-name">Auto-title chats</span><input id="t-title" type="checkbox" checked/><span class="switch" aria-hidden="true"></span></label>
          <label class="pn-toggle"><span class="pn-name">Smart Auto model</span><input id="t-auto" type="checkbox" checked/><span class="switch" aria-hidden="true"></span></label>
        </div>
      </section>

      <section class="pn-section">
        <h3 class="pn-label">Usage</h3>
        <div id="usage-list" class="usage-list"></div>
      </section>

      <section class="pn-section pn-danger">
        <button id="btn-export-all-2" class="pn-btn">Export all conversations</button>
        <button id="btn-import-2" class="pn-btn">Import conversations</button>
        <button id="btn-clear-all" class="pn-btn pn-btn-danger">Clear all conversations</button>
      </section>
      <p class="pn-foot">Runs entirely in your browser. AI calls are powered by Puter.js (free, no API keys — usage is billed to your Puter account).</p>
    </div>
  </aside>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="modal" class="modal">
  <form method="dialog" class="modal-card">
    <h2 id="modal-title" class="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-ghost" value="cancel">Cancel</button>
      <button id="modal-ok" class="btn-rose" value="ok">Confirm</button>
    </div>
  </form>
</dialog>

<script src="src/models.js"></script>
<script src="src/markdown.js"></script>
<script src="src/storage.js"></script>
<script src="src/app.js"></script>
</body>
</html>
